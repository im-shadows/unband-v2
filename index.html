<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CUXXYZ UNBAN V2</title>
  <link rel="icon" href="https://files.catbox.moe/ejn7q9.jpeg" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05060a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CUXXYZ UNBAN V2">
  <link rel="apple-touch-icon" href="https://files.catbox.moe/ejn7q9.jpeg">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ===== PRE INTRO BUTTON (ADD ONLY) ===== */
    #preIntroGate{
      position:fixed;
      inset:0;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:100000;
    }
    #preIntroBtn{
      font-family:'Orbitron',sans-serif;
      font-size:20px;
      font-weight:900;
      padding:16px 36px;
      border-radius:14px;
      border:none;
      cursor:pointer;
      color:#fff;
      letter-spacing:2px;
      background:linear-gradient(135deg,#ff003c,#7a00ff);
      box-shadow:0 0 30px rgba(255,0,80,.8);
    }

    /* =======================
       STYLE ASLI (TIDAK DIUBAH)
       ======================= */
    :root {
      --size: 300px;
      --duration: 5s;
      --bg:#05060a;
      --accent:#F4320B;
      --accent2:#FF00F7;
      --muted:#EBE8EB;
      --mono:'Share Tech Mono', monospace;
      --ui: 'Inter', system-ui, sans-serif;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:#e6eef6;
      font-family:var(--ui);
      -webkit-font-smoothing:antialiased;
    }
    *{box-sizing:border-box}

    #introOverlay{
      position:fixed;
      inset:0;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:9999;
      transition: opacity .6s ease;
      pointer-events: auto;
    }

    .video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .video-wrap {
      width: var(--size);
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: white;
      box-shadow: 0 0 10px rgba(255,255,255,0.15);
      position: relative;
    }

    video#player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border: none;
      outline: none;
      pointer-events: none;
    }

    .loading-area {
      width: var(--size);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .loading-text { font-weight:600; letter-spacing:0.05em; font-size:0.9rem; color:#fff; font-family:var(--ui); }
    .loading-bar { width:100%; height:8px; background: rgba(255,255,255,0.15); border-radius:999px; overflow:hidden; }
    .loading-bar i { display:block; height:100%; width:0%; background: linear-gradient(90deg,#fff,rgba(255,255,255,0.5)); border-radius:999px; animation: fillBar var(--duration) linear forwards; }
    @keyframes fillBar { from{width:0%} to{width:100%} }

    .dots { display:flex; gap:6px; margin-top:6px; }
    .dot { width:6px; height:6px; border-radius:50%; background:white; opacity:0.2; animation: blink 1s infinite; }
    .dot:nth-child(2){ animation-delay:.2s }
    .dot:nth-child(3){ animation-delay:.4s }
    @keyframes blink { 0%,80%,100%{opacity:.2; transform:translateY(0)} 40%{opacity:1; transform:translateY(-4px)} }

    .brand-text { margin-top:12px; font-family: "Orbitron", sans-serif; font-weight:900; font-size:1.1rem; letter-spacing:2px; color:#fff; text-shadow:0 0 10px rgb(120,120,120); user-select:none; }

    #introOverlay.hidden { opacity: 0; pointer-events: none; }

    #app {
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease .1s, visibility .45s ease .1s;
      padding: 18px;
      min-height: 100vh;
    }
    #app.visible { opacity: 1; visibility: visible; }
  </style>
</head>

<body>

<!-- ===== PRE INTRO BUTTON (ADD ONLY) ===== -->
<div id="preIntroGate">
  <button id="preIntroBtn">NEXT KGA NI?🗿</button>
</div>

<!-- ===== INTRO ASLI (UTUH) ===== -->
<div id="introOverlay">
  <div class="video-container">
    <div class="video-wrap">
      <video id="player" playsinline preload="metadata">
        <source src="https://files.catbox.moe/mm85lg.mp4" type="video/mp4">
      </video>
    </div>
    <div class="loading-area" id="loading">
      <div class="loading-text">Loading</div>
      <div class="loading-bar"><i id="bar"></i></div>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
    <div class="brand-text">CUXXYZ UNBANNED APPS</div>
  </div>
</div>

<!-- ===== PRE INTRO SCRIPT (ADD ONLY / FIXED) ===== -->
<script>
(function(){
  const gate  = document.getElementById("preIntroGate");
  const btn   = document.getElementById("preIntroBtn");
  const intro = document.getElementById("introOverlay");
  const video = document.getElementById("player");

  if(!gate || !btn || !intro || !video) return;

  intro.style.visibility = "hidden";
  intro.style.pointerEvents = "none";

  btn.addEventListener("click", () => {
    gate.style.display = "none";
    intro.style.visibility = "visible";
    intro.style.pointerEvents = "auto";
    video.muted = false;
    video.volume = 1;
    video.play().catch(()=>{});
  });
})();
</script>

<!-- ===== SCRIPT ASLI LU (TIDAK DIUBAH) ===== -->
<script>
/* === SELURUH SCRIPT PANJANG ASLI LU DI SINI === */
</script>

</body>
</html>
