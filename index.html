<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>CUXXYZ UNBAN V2</title>
<link rel="icon" href="https://files.catbox.moe/ejn7q9.jpeg" />

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CUXXYZ UNBAN V2">
<link rel="apple-touch-icon" href="https://files.catbox.moe/ejn7q9.jpeg">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ===== TAMBAHAN TOMBOL AUTOPLAY (AMAN) ===== */
#forcePlayBtn{
  margin-top:18px;
  padding:12px 28px;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:15px;
  letter-spacing:1px;
  color:#fff;
  background:linear-gradient(135deg,#ff004c,#6f00ff);
  border:none;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,90,.7);
}

/* ===== STYLE ASLI (TIDAK DIUBAH) ===== */
:root {
  --size:300px;
  --duration:5s;
  --bg:#05060a;
  --accent:#F4320B;
  --accent2:#FF00F7;
  --muted:#EBE8EB;
  --mono:'Share Tech Mono', monospace;
  --ui:'Inter', system-ui, sans-serif;
}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:#e6eef6;
  font-family:var(--ui);
}
*{box-sizing:border-box}

#introOverlay{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition:opacity .6s ease;
}

.video-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.video-wrap{
  width:var(--size);
  aspect-ratio:1/1;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

video#player{
  width:100%;
  height:100%;
  object-fit:cover;
}

.loading-area{
  width:var(--size);
  text-align:center;
}

.loading-bar{
  height:8px;
  background:rgba(255,255,255,.15);
  border-radius:999px;
  overflow:hidden;
}

.loading-bar i{
  display:block;
  height:100%;
  width:0%;
  background:#fff;
  animation:fillBar var(--duration) linear forwards;
}

@keyframes fillBar{to{width:100%}}

#introOverlay.hidden{
  opacity:0;
  pointer-events:none;
}

#app{
  opacity:0;
  visibility:hidden;
  transition:.45s;
}
#app.visible{
  opacity:1;
  visibility:visible;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="introOverlay">
  <div class="video-container">

    <div class="video-wrap">
      <video id="player" playsinline preload="metadata">
        <source src="https://files.catbox.moe/mm85lg.mp4" type="video/mp4">
      </video>
    </div>

    <div class="loading-area" id="loading">
      <div class="loading-bar"><i id="bar"></i></div>
    </div>

    <!-- 🔥 TOMBOL AUTOPLAY (TAMBAHAN AMAN) -->
    <button id="forcePlayBtn">NEXT KGA NI?🗿</button>

    <div class="brand-text">CUXXYZ UNBANNED APPS</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- ISI APP ASLI LU (TIDAK DIUBAH) -->
</div>

<script>
/* ===== SCRIPT ASLI LU (TETAP) ===== */
const video=document.getElementById("player");
const bar=document.getElementById("bar");
const introOverlay=document.getElementById("introOverlay");
const app=document.getElementById("app");

video.addEventListener("loadedmetadata",()=>{
  const d=video.duration||5;
  document.documentElement.style.setProperty("--duration",d+"s");
});

function tryPlay(){
  video.muted=false;
  video.play().catch(()=>{
    video.muted=true;
    video.play().catch(()=>{});
  });
}
window.addEventListener("load",tryPlay);

video.addEventListener("ended",()=>{
  introOverlay.classList.add("hidden");
  setTimeout(()=>{
    introOverlay.style.display="none";
    app.classList.add("visible");
  },600);
});

/* ===== TAMBAHAN KECIL (AMAN) ===== */
const btn=document.getElementById("forcePlayBtn");
btn.addEventListener("click",()=>{
  video.muted=false;
  video.play().then(()=>{
    btn.remove();
  }).catch(()=>{});
});
</script>

</body>
</html>
