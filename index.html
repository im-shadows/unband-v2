<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CUXXYZ UNBAN V2</title>
  <link rel="icon" href="https://files.catbox.moe/ejn7q9.jpeg" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05060a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CUXXYZ UNBAN V2">
  <link rel="apple-touch-icon" href="https://files.catbox.moe/ejn7q9.jpeg">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --size: 300px;
      --duration: 5s;
      --bg:#05060a;
      --accent:#F4320B;
      --accent2:#FF00F7;
      --muted:#EBE8EB;
      --mono:'Share Tech Mono', monospace;
      --ui: 'Inter', system-ui, sans-serif;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:#e6eef6;
      font-family:var(--ui);
    }
    *{box-sizing:border-box}

    /* ================= PRE INTRO ================= */
    #preIntro{
      position:fixed;
      inset:0;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10001;
    }
    #startIntroBtn{
      font-family:'Orbitron',sans-serif;
      font-size:18px;
      padding:14px 28px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      font-weight:900;
      letter-spacing:1px;
      background:linear-gradient(90deg,#ff0000,#ff4a4a);
      color:#000;
      box-shadow:0 0 20px rgba(255,0,0,0.5);
    }

    /* ================= INTRO ================= */
    #introOverlay{
      position:fixed;
      inset:0;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10000;
      transition: opacity .6s ease;
    }
    #introOverlay.hidden{opacity:0;pointer-events:none}

    .video-container{display:flex;flex-direction:column;align-items:center;gap:12px}
    .video-wrap{
      width:var(--size);
      aspect-ratio:1/1;
      border-radius:10px;
      overflow:hidden;
      background:#fff;
    }
    video{width:100%;height:100%;object-fit:cover}
    .loading-text{color:#fff}
    .loading-bar{width:100%;height:8px;background:rgba(255,255,255,.2);border-radius:99px}
    .loading-bar i{display:block;height:100%;background:#fff;animation:fillBar var(--duration) linear forwards}
    @keyframes fillBar{to{width:100%}}
    .brand-text{margin-top:10px;font-family:Orbitron;font-weight:900;color:#fff}

    #app{opacity:0;visibility:hidden}
    #app.visible{opacity:1;visibility:visible}
  </style>
</head>

<body>

<!-- PRE INTRO -->
<div id="preIntro">
  <button id="startIntroBtn">Next kga ni?</button>
</div>

<!-- INTRO -->
<div id="introOverlay" style="display:none">
  <div class="video-container">
    <div class="video-wrap">
      <video id="player" playsinline preload="metadata">
        <source src="https://files.catbox.moe/mm85lg.mp4" type="video/mp4">
      </video>
    </div>
    <div class="loading-bar"><i id="bar"></i></div>
    <div class="brand-text">CUXXYZ UNBANNED APPS</div>
  </div>
</div>

<!-- APP -->
<div id="app"></div>

<script>
  const preIntro = document.getElementById("preIntro");
  const startBtn = document.getElementById("startIntroBtn");
  const intro = document.getElementById("introOverlay");
  const video = document.getElementById("player");
  const bar = document.getElementById("bar");

  startBtn.addEventListener("click",()=>{
    preIntro.style.display="none";
    intro.style.display="flex";

    video.muted=false;
    video.volume=1;
    video.play().catch(()=>{});
  });

  video.addEventListener("loadedmetadata",()=>{
    bar.style.animationDuration=(video.duration||5)+"s";
  });

  video.addEventListener("ended",()=>{
    intro.classList.add("hidden");
    setTimeout(()=>{
      intro.style.display="none";
      document.getElementById("app").classList.add("visible");
    },600);
  });
</script>

</body>
</html>
